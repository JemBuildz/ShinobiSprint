  <style type="text/css">
    html {

    body.loading-mode {
      min-height: 100%;
      display: flex;
      flex: 1;
      align-items: center;

      -o-background-size: cover;
      background-size: cover;
    }

    .loading-mode p {
      font-family: "Google Sans Text", sans-serif;
      font-style: normal;
      font-weight: 700;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #FBBF24;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 16px rgba(0, 0, 0, 0.9);

      display: none;

      position: fixed;

      background-color: #3130364D;
      border: 2px solid rgba(255, 255, 255, .2);

      justify-content: space-between;

      z-index: 9999;

      border-top-right-radius: 15px;

    #cookie-bar p {

  <script>

<body class="loading-mode">
  <p id="splash-copy">
    LOADING SHINOBI SPRINT...
  </p>
  <div id="progress-bar">
    <div id="progress-indicator"></div>
  </div>
  <script src="flutter.js" defer></script>
  <script>
    // Force unregister service workers and clear browser cache storage for live development
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    window.addEventListener("load", function (ev) {
      const progressBar = document.querySelector("#progress-bar");
      const splashCopy = document.querySelector("#splash-copy");
      const splashLogo = document.querySelector("#splash-logo");

      function startApp(engineInitializer) {
        engineInitializer.initializeEngine().then(function (appRunner) {
          window.addEventListener("flutter-first-frame", function () {
            if (progressBar) progressBar.remove();
            if (splashLogo) splashLogo.remove();
            if (splashCopy) splashCopy.remove();
            document.body.classList.remove("loading-mode");
          });
          appRunner.runApp();
        });
      }

      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorkerSettings: null,
          onEntrypointLoaded: startApp,
        });
      }
    });
  </script>
</body>
