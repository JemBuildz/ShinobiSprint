<script>
  // Simple playful audio toggle interaction
  const audioBtn = document.getElementById('audio-toggle');
  if (audioBtn) {
    let muted = false;
    audioBtn.addEventListener('click', () => {
      muted = !muted;
      const icon = audioBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.textContent = muted ? 'volume_off' : 'volume_up';
        icon.style.color = muted ? '#86948a' : '';
      }
    });
  }

  // Micro tactile feedback on guest button
  const guestBtn = document.getElementById('btn-guest-play');
  if (guestBtn) {
    guestBtn.addEventListener('click', () => {
      const originalText = guestBtn.querySelector('span:nth-child(2)').textContent;
      guestBtn.querySelector('span:nth-child(2)').textContent = 'ENTERING WORLD...';
      guestBtn.classList.add('bg-primary-container', 'text-on-primary-container');
      setTimeout(() => {
        guestBtn.querySelector('span:nth-child(2)').textContent = originalText;
        guestBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
      }, 1200);
    });
  }
</script></main>
